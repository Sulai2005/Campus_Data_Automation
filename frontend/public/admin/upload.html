<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload - University Management System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles/main.css">
    <style>
        .navbar-user {
            position: relative;
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <div class="navbar-content">
            <a href="/admin/dashboard" class="navbar-brand">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2L2 7L12 12L22 7L12 2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" />
                </svg>
                University Management System
            </a>

            <div class="navbar-right">
                <ul class="navbar-menu">
                    <li><a href="/admin/dashboard" class="navbar-link">Dashboard</a></li>
                    <li><a href="/admin/upload" class="navbar-link active">Upload</a></li>
                    <li><a href="/admin/reports" class="navbar-link">Reports</a></li>
                </ul>

                <!-- User Profile Dropdown -->
                <div class="navbar-user" id="userMenu">
                    <button class="user-menu-btn" onclick="toggleUserMenu()">
                        <div class="user-avatar">A</div>
                        <div class="user-info">
                            <span class="user-name">Administrator</span>
                            <span class="user-role">Admin</span>
                        </div>
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M6 9L12 15L18 9" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" />
                        </svg>
                    </button>
                    <div class="user-dropdown">
                        <a href="#" class="dropdown-item">My Profile</a>
                        <a href="#" class="dropdown-item">Settings</a>
                        <div style="border-top: 1px solid var(--border-color); margin: 0.25rem 0;"></div>
                        <a href="#" class="dropdown-item danger" onclick="logout()">Logout</a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="card mb-4" style="max-width: 800px; margin: 0 auto;">
            <div class="card-header">
                <h2>Upload Files & Data</h2>
                <p>Upload student documents and bulk records.</p>
            </div>

            <div id="messageContainer"></div>

            <!-- File Upload Section -->
            <div style="margin-bottom: 2rem;">
                <h3
                    style="margin-bottom: 1rem; font-size: 1.1rem; border-bottom: 1px solid var(--border-color); padding-bottom: 0.5rem;">
                    Single Document Upload</h3>
                <form id="fileUploadForm">
                    <div class="grid grid-2">
                        <div class="form-group">
                            <label for="studentId" class="form-label">Student Database ID</label>
                            <input type="number" id="studentId" class="form-input" placeholder="e.g. 1, 2, 3" required>
                        </div>

                        <div class="form-group">
                            <label for="fileType" class="form-label">Document Type</label>
                            <select id="fileType" class="form-select" required>
                                <option value="">Select type...</option>
                                <option value="photo">Photo</option>
                                <option value="certificate">Certificate</option>
                                <option value="id_proof">ID Proof</option>
                                <option value="transcript">Transcript</option>
                                <option value="other">Other</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="file" class="form-label">Select File</label>
                        <input type="file" id="file" class="form-input" accept=".jpg,.jpeg,.png,.pdf,.doc,.docx"
                            required style="padding: 0.5rem;">
                        <p class="text-secondary" style="font-size: 0.8rem; margin-top: 0.5rem;">
                            Allowed: JPG, PNG, PDF, DOC, DOCX (Max 5MB)
                        </p>
                    </div>

                    <button type="submit" class="btn btn-primary">
                        Upload Document
                    </button>
                </form>
            </div>

            <!-- Bulk Data Upload Section -->
            <div style="opacity: 0.7; border-top: 1px dashed var(--border-color); padding-top: 2rem;">
                <h3 style="margin-bottom: 1rem; font-size: 1.1rem;">Bulk Data Import</h3>
                <p>Import multiple student records via CSV or Excel.</p>

                <div class="form-group">
                    <input type="file" id="bulkFile" class="form-input" accept=".csv,.xlsx,.xls" disabled
                        style="cursor: not-allowed; background-color: #f1f5f9;">
                </div>

                <button class="btn btn-secondary" disabled style="cursor: not-allowed;">
                    Feature Coming Soon
                </button>
            </div>
        </div>
    </div>

    <script src="/scripts/auth.js"></script>
    <script>
        // Check Auth
        requireAuth();
        requireRole('admin');

        function toggleUserMenu() {
            const menu = document.getElementById('userMenu');
            menu.classList.toggle('active');
        }

        // Close dropdown when clicking outside
        document.addEventListener('click', (e) => {
            const menu = document.getElementById('userMenu');
            const btn = document.querySelector('.user-menu-btn');
            if (menu && !menu.contains(e.target) && !btn.contains(e.target)) {
                menu.classList.remove('active');
            }
        });

        const fileUploadForm = document.getElementById('fileUploadForm');

        if (fileUploadForm) {
            fileUploadForm.addEventListener('submit', async (e) => {
                e.preventDefault();

                const studentId = document.getElementById('studentId').value;
                const fileType = document.getElementById('fileType').value;
                const fileInput = document.getElementById('file');
                const file = fileInput.files[0];
                const msgContainer = document.getElementById('messageContainer');

                if (!file) {
                    msgContainer.innerHTML = '<div class="alert alert-error">Please select a file</div>';
                    return;
                }

                // Create form data
                const formData = new FormData();
                formData.append('file', file);
                formData.append('student_id', studentId);
                formData.append('file_type', fileType);

                try {
                    const token = getToken();
                    // Assuming API_BASE_URL is available

                    const response = await fetch(`${API_BASE_URL}/admin/upload/file`, {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${token}`
                        },
                        body: formData
                    });

                    const data = await response.json();

                    if (!response.ok) {
                        throw new Error(data.detail || 'Upload failed');
                    }

                    msgContainer.innerHTML = '<div class="alert alert-success">File uploaded successfully!</div>';
                    fileUploadForm.reset();

                } catch (error) {
                    console.error("Upload error:", error);
                    msgContainer.innerHTML = `<div class="alert alert-error">${error.message}</div>`;
                }
            });
        }

        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('role');
            window.location.href = '/';
        }
    </script>
</body>

</html>
